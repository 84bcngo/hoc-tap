<script>
/* ============ DU LIEU CO DINH: TKB 6A14 (theo ngay ap dung) ============ */
// TKB so 3: 28/09/2026 -> 04/10/2026
const TKB_V3 = {
  1: [{s:'SH',l:'Chào cờ'},{s:'Tiếng Anh'},{s:'Tiếng Anh'},{s:'Âm nhạc'},{s:'Toán'}],
  2: [{s:'Công nghệ'},{s:'LS&ĐL'},{s:'GDCD'},{s:'Toán'},{s:'KHTN'}],
  3: [{s:'Thể dục'},{s:'Thể dục'},{s:'Toán'},{s:'Toán'},{s:'GDĐP'}],
  4: [{s:'Mĩ thuật'},{s:'LS&ĐL'},{s:'Văn'},{s:'Văn'},{s:'KHTN'}],
  5: [{s:'SH',l:'SHL'},{s:'Tin học'},{s:'Văn'},{s:'Văn'},{s:'LS&ĐL'}],
  6: [{s:'KHTN'},{s:'KHTN'},{s:'Tiếng Anh'},{s:'HĐTN',l:'SHCĐ'}]
};
// TKB so 4: tu thu Hai 05/10/2026 (GVCN gui)
const TKB_V4 = {
  1: [{s:'SH',l:'Chào cờ'},{s:'Tiếng Anh'},{s:'Tin học'},{s:'Công nghệ'},{s:'SH',l:'SHL'}],
  2: [{s:'HĐTN',l:'SHCĐ'},{s:'GDCD'},{s:'Toán'},{s:'Tiếng Anh'},{s:'KHTN'}],
  3: [{s:'Thể dục'},{s:'Thể dục'},{s:'Toán'},{s:'Toán'},{s:'GDĐP'}],
  4: [{s:'Mĩ thuật'},{s:'KHTN'},{s:'Văn'},{s:'Văn'},{s:'LS&ĐL'}],
  5: [{s:'LS&ĐL'},{s:'LS&ĐL'},{s:'Toán'},{s:'Tiếng Anh'},{s:'KHTN'}],
  6: [{s:'Văn'},{s:'Văn'},{s:'Âm nhạc'},{s:'KHTN'}]
};
// TKB so 5: tu thu Hai 19/10/2026 – co giao doi: T2 tiet 5 hoc Toan, T3 tiet 3 sinh hoat lop (ba 19/10)
const TKB_V5 = {
  1: [{s:'SH',l:'Chào cờ'},{s:'Tiếng Anh'},{s:'Tin học'},{s:'Công nghệ'},{s:'Toán'}],
  2: [{s:'HĐTN',l:'SHCĐ'},{s:'GDCD'},{s:'SH',l:'SHL'},{s:'Tiếng Anh'},{s:'KHTN'}],
  3: TKB_V4[3], 4: TKB_V4[4], 5: TKB_V4[5], 6: TKB_V4[6]
};
// TKB moi (truong ghi "So 5", thuc hien tu 26/10/2026 – ba gui anh 25/10). Toan: T2, T3 So hoc; T6 tiet 3 Hinh hoc, tiet 4 So hoc.
const TKB_V6 = {
  1: [{s:'SH',l:'Chào cờ'},{s:'SH',l:'SHL'},{s:'Toán'},{s:'KHTN'},{s:'KHTN'}],
  2: [{s:'Toán'},{s:'Tiếng Anh'},{s:'Tin học'},{s:'GDCD'},{s:'LS&ĐL'}],
  3: [{s:'Thể dục'},{s:'Thể dục'},{s:'Âm nhạc'},{s:'Công nghệ'},{s:'LS&ĐL'}],
  4: [{s:'GDĐP'},{s:'LS&ĐL'},{s:'Văn'},{s:'Văn'},{s:'Tiếng Anh'}],
  5: [{s:'Tiếng Anh'},{s:'Mĩ thuật'},{s:'Toán',l:'Toán (Hình học)'},{s:'Toán',l:'Toán (Số học)'},{s:'KHTN'}],
  6: [{s:'Văn'},{s:'Văn'},{s:'HĐTN',l:'SHCĐ'},{s:'KHTN'}]
};
const TKB_LIST = [
  {from:'2026-09-28', no:3, t:TKB_V3, shift:{5:{'Tin học':2}}},
  {from:'2026-10-05', no:4, t:TKB_V4, shift:{}},
  {from:'2026-10-19', no:5, t:TKB_V5, shift:{}},
  {from:'2026-10-26', no:6, t:TKB_V6, shift:{}}   // ba 7/10: bai chi giao vao chieu truoc buoi hoc theo TKB (bo lam som Anh tu T3)
];
const tkbVer = d => { let v = TKB_LIST[0]; for (const x of TKB_LIST) if (d >= x.from) v = x; return v; };

async function addTask(t){
  const body = {status:'todo', ...t, createdAt: new Date().toISOString()};
  if (S.db){ await S.db.collection('tasks').add(body); }
  else { S.tasks.push({id:'m'+Math.random().toString(36).slice(2), ...body}); memoReset(); render(); }
}
async function updTask(id, patch){
  if (S.db){ await S.db.doc('tasks/'+id).update(patch); }
  else { Object.assign(S.tasks.find(t=>t.id===id)||{}, patch); memoReset(); render(); }
}
// Bai co han dung ngay nghi -> doi sang buoi hoc ke tiep cua mon do (eNetViet nop online giu nguyen)
async function shiftOffTasks(day){
  const list = S.tasks.filter(t => isOpen(t) && t.due===day && t.source!=='W' && t.subject);
  for (const t of list) await updTask(t.id, {due: nextLesson(t.subject, day), dueShiftFrom: day});
  return list.length;
}
async function delTask(id){
  if (S.db){ await S.db.doc('tasks/'+id).delete(); }
  else { S.tasks = S.tasks.filter(t=>t.id!==id); render(); }
}
async function setDoc(col, id, body){
  if (S.db){ await S.db.doc(col+'/'+id).set(body); if (col==='keys'){ S.keys = {...S.keys, [id]: body}; render(); } return; }
  if (col==='logs') S.logs[id] = body;
  else if (col==='reviews') S.reviews[id] = body;
  else if (col==='sbt') S.sbt[id] = body;
  else if (col==='keys') S.keys[id] = body;
  else if (col==='checks') S.checks[id] = body;
  else if (col==='scores'){ S.scores = S.scores.filter(x=>x.id!==id).concat([{id, ...body}]); }
  else if (col==='progress'){ setProgress((S.progRaw||[]).filter(x=>x.id!==id).concat([{id, ...body}])); }
  render();
}

// Moi dong = mot mon (LS&DL tach Lich su / Dia li; Toan tach Hinh hoc / So hoc). Mon dang on kiem tra khong doi.
function moveRows(day){
  const OP = orderedPlan(day), exS = OP.exS, rows = {};
  const add = lab => rows[lab] || (rows[lab] = {key: lab, label: lab, tasks: [], mem: [], min: 0});
  [...OP.groups.flatMap(g => g.tasks), ...OP.extraOld].forEach(t => {
    if (!isOpen(t) || isExam(t) || exS.has(t.subject) || t.checkDue) return;
    const r = add(subjLabel(t.subject, t.lessonNo || '')); if (r.tasks.some(o => o.id === t.id)) return; r.tasks.push(t); r.min += estMin(t); });
  memTargets(day).forEach(x => { if (exS.has(x.sj) || !x.planned) return; const r = add(subjLabel(x.sj, x.L.no)); r.mem.push(x); r.min += 5; });
  return Object.values(rows);
}
// Cac chieu co the doi toi: 6 chieu hoc ke tiep (bo Chu nhat, ngay nghi); bai chua toi han thi phai truoc chieu hom truoc han nop
function moveDays(day, r){
  const lim = r.tasks.filter(t => t.due && t.due > day && !t.backlog).map(t => workDay(t.due)).sort()[0];
  const out = []; let x = day;
  for (let i = 0; i < 12 && out.length < 6; i++){ x = addDays(x, 1); if (dow(x) === 0 || isOff(x)) continue; if (lim && x > lim) break; out.push(x); }
  return out;
}

/* Dinh dang tin nhan: **dam**, [[mau|chu dam co mau]] */
const u = x => String(x ?? '').replace(/\*\*|\[\[|\]\]/g, '').replace(/theo tiến độ/g, 'xem bài cũ');
const ZCOL = {red:'#D0342C', orange:'#C27200', purple:'#6A45B8', blue:'#1F5FBF', gray:'#6B7280', green:'#1E8E3E', yellow:'#D4A000'};
const msgPlain = m => m.replace(/\[\[\w+\|(.*?)\]\]/g, '$1').replace(/\*\*(.*?)\*\*/g, '$1');
const msgHTML = (m, inline) => esc(m)
  .replace(/\[\[(\w+)\|(.*?)\]\]/g, (_, c, t) => inline ? `<b style="color:${ZCOL[c]||'#000'}">${t}</b>` : `<b class="mc-${c}">${t}</b>`)
  .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
// Danh sach bai hien thi trong tin nhan Zalo cua 1 ngay (dung chung cho tin nhan va the Cham bai nhanh)
function planFor(day, withDone){ return memo('planFor', [day, !!withDone], () => planFor0(day, withDone)); }
function planFor0(day, withDone){
  const w = dow(day), tm = nextSchool(day), pf = PROFILE[w];
  const open0 = tasksFor(day).filter(t => isOpen(t) || (withDone && t.status==='done' && t.doneAt===day));
  const exS = examSubjects(day), exam = exS.size > 0;
  const overdue = t => pastDue(t, day);   // phan loai no theo han, ke ca bai da xong hom nay
  // Chi lam hom nay: mon co tiet ngay mai, mon dang on KT, hoac bai da den ngay phai lam (chieu truoc han)
  const relevant = sj => exS.has(sj) || hasClass(sj, tm);
  const open = open0.filter(t => isOpen(t) || relevant(t.subject) || (t.due && t.due > day));   // bai da xong hom nay cua mon khong lien quan -> an
  const oldWork = open.filter(t => t.backlog).sort((a,b)=>String(a.planDay).localeCompare(String(b.planDay)) || (srcRank(a)-srcRank(b)));
  const allDebts = open.filter(t=>!t.backlog && overdue(t)).sort(byPrio(day));
  const planned = t => !t.backlog && !!t.planDay && t.planDay <= day;   // ba chu dong giao vao chieu nay
  // Toan dang on KT mot phan (vd Hinh hoc): bai cua phan kia (ke ca bai no) doi sang chieu truoc buoi cua phan do (ba 22/10)
  const eps = exS.has('Toán') && day >= TOAN_PART_FROM ? examParts('Toán') : null;
  const offExam = t => !!eps && t.subject==='Toán' && !t.backlog && !isExam(t) && !planned(t) && (p => !!p && !eps.includes(p))(partOf('Toán', t.lessonNo||''));
  const debts = allDebts.filter(t => (relevant(t.subject) || planned(t)) && !exS.has(t.subject));   // no mon dang on KT gop vao nhom on tap
  const laterDebts = allDebts.filter(t => !relevant(t.subject) && !planned(t)).map(t => ({t, doDay: workDay(nextLesson(t.subject, day)), debt: true}))
    .concat(allDebts.filter(offExam).map(t => ({t, doDay: workDay(nextLesson('Toán', day, partOf('Toán', t.lessonNo||''))), debt: true})));
  let rest = open.filter(t=>!t.backlog && !offExam(t) && (!overdue(t) || exS.has(t.subject))).sort(byPrio(day));
  const notYet = rest.filter(t => !planned(t) && !relevant(t.subject) && !(t.due && (t.due <= tm || workDay(t.due) <= day || (earlyDays(t.subject, t.due) && addDays(t.due, -earlyDays(t.subject, t.due)) <= day))));
  rest = rest.filter(t => !notYet.includes(t));
  // Che do on kiem tra: bai mon khac chua gap (han sau ngay mai) doi sang hom khac de danh thoi gian on
  const deferred = (exam ? rest.filter(t => !planned(t) && !exS.has(t.subject) && t.due && t.due > tm && prioOf(t,day)!=='P1') : []).concat(open.filter(t => offExam(t) && !overdue(t)));
  if (exam) rest = rest.filter(t => !deferred.includes(t) && !(prioOf(t,day)==='P3' && !exS.has(t.subject)));
  const g = {P1:[],P2:[],P3:[]}; rest.forEach(t=>g[prioOf(t,day)].push(t));
  const shown = debts.concat(oldWork, g.P1, g.P2, (g.P3.length && !pf.english && !exam) ? g.P3.slice(0,3) : []);
  return {w, tm, pf, open, exS, exam, oldWork, debts, laterDebts, deferred, notYet, g, shown};
}
// Ten ngan cua bai: "Lịch sử Bài 4", "Văn – Viết: kể lại một trải nghiệm"...
const clip = (x, n) => { x = String(x||'').trim(); if (x.length <= n) return x; const c = x.slice(0, n); return c.slice(0, c.lastIndexOf(' ') > n*0.6 ? c.lastIndexOf(' ') : n).replace(/[\s,.;:–-]+$/,'') + '…'; };
// Uoc luong so phut cua 1 nhiem vu (de xep bai ngan / tinh tai)
// Mon phu tu dong (GDCD, Cong nghe): on bai + SBT ngan, toi da 15 phut moi muc
function estMin(t){ if (t.min) return +t.min;   // ba/Claude dat san thoi luong (vd buoi on de cuong gop – ba 28/10)
  const m = estMin0(t); return (t.source!=='P' && AUTO_SUBJECTS.includes(t.subject) && !SBT_SUBJECTS.includes(t.subject)) ? Math.min(15, m) : m; }
function estMin0(t){
  const txt = String(t.content||''), n = (txt.match(/\b\d+\.\d+\b|TN\d+|câu\s*\d+/gi) || []).length;
  if (t.marker) return 0;   // dong 'Kiem tra giua ki ...' chi de nhac ngay thi; viec on nam o buoi on de cuong (ba 28/10)
  if (isExam(t)) return 30;
  if (t.source==='P') return 30;   // san pham nop: ve, thiep, mo hinh, thuyet trinh
  // Bai co trong muc luc: uoc theo so trang (khoang 10 phut / trang, 10–30 phut)
  const cat = t.lessonNo ? catOf(t.subject, t.book || (t.source==='S' ? 'SBT' : 'SGK')) : null, L = cat && findLesson(cat, t.lessonNo);
  if (/ôn phần đã học/.test(txt)) return 10;
  if (L && (t.checkDue || t.backlog || !n)){ const pg = String(lessonPages(L)).match(/(\d+)\s*[–-]\s*(\d+)/), np = pg ? (+pg[2] - +pg[1] + 1) : 1; return Math.min(30, Math.max(10, np * 10)); }
  if (t.checkDue || t.backlog) return 20;
  // Viec tong hop (vd hoan thanh VBT) khi cac bai no da duoc tach rieng -> chi con ra soat
  if (!t.lessonNo && S.tasks.some(o => o.backlog && o.subject===t.subject && isOpen(o)) && CHECK_RE.test(txt)) return 10;
  if (n) return Math.max(5, n * 4);
  if (t.source==='V') return /chép|nhiều lần|bài văn|đoạn văn/i.test(txt) ? 15 : 10;
  if (t.source==='H') return 15;
  if (t.source==='S') return 20;
  return 15;
}
function shortTask(t, noPart){
  const sj = t.subject, book = t.book || (t.source==='S' ? 'SBT' : 'SGK'), cat = catOf(sj, book) || catOf(sj, 'SGK');
  const L = t.lessonNo && cat ? findLesson(cat, t.lessonNo) : null;
  if (L){ const pr = S.progress.filter(p=>p.subject===sj && String(p.lesson)===String(L.no)).sort((a,b)=>b.date.localeCompare(a.date))[0];
    let name, topic;
    if (sj==='LS&ĐL'){ const m = String(L.title||'').match(/^(Lịch sử|Địa lí)\s*–\s*(Bài\s*\d+)\.?\s*(.*)$/); name = m ? `${m[1]} ${m[2]}` : lessonLabel(L); topic = m ? m[3] : ''; }
    else if (/^\d/.test(String(L.no))){ name = `${sj} Bài ${L.no}`; topic = String(L.title||'').replace(/^Bài\s*\d+\s*[–-]\s*/,''); }
    else { name = `${sj} ${L.title||L.no}`; topic = ''; }
    return pr && lessonPart(pr.part) && !noPart ? `${name} – ${clip(lessonPart(pr.part), 40)}` : (topic ? `${name} (${topic})` : name); }
  return `${sj} – ${clip(u(String(t.content||'').split(/[:(]/)[0]), 45)}`;
}

  // Ba 28/10: cuoi dong bai giao khong ghi han nop – da giao vao chieu nay la phai xong chieu nay. Chi danh dau bai no.
  const tagOf = t => t.checkDue ? ' [[orange|(nợ – làm bù)]]' : t.backlog ? '' : (t.source==='W' && t.due===day) ? ' (nộp trên eNetViet)' : (pastDue(t, day) && !/chưa làm từ buổi trước/.test(t.content||'')) ? ' [[orange|(nợ)]]' : '';
  groups.forEach((gr, i) => { if (SP) SP._gs.push(L.length);
    const sl = slot(gr.tasks.reduce((n,t) => n + estMin(t), 0) + (gr.exam ? 15 : 0));
    const col = gr.exam || gr.hot ? 'red' : 'orange', no = NUM[i] || `${i+1}.`;
    L.push('');
    if (gr.exam){
      // On tap: chi on kien thuc / hoc thuoc / hoi mieng (ba 7/10) – khong giao lai bai tap da lam
      // Toan (ba 22/10): ghi ro on phan nao (Hinh hoc / So hoc); bai cua phan khong kiem tra xep sau, ghi chu ro
      const eps = gr.sj==='Toán' ? examParts('Toán') : [], tPart = t => isExam(t) ? examPartOf('Toán', t) : partOf('Toán', t.lessonNo || '');
      const other = t => eps.length && tPart(t) && !eps.includes(tPart(t));
      const tl = t => `   – [${SRC[t.source]||'Vở'}] ${other(t) ? partName(tPart(t)) + ' – ' : ''}${u(t.content)}${isExam(t) ? '' : tagOf(t)}`;
      const tks = eps.length ? [...gr.tasks].sort((x,y) => (other(x)?1:0) - (other(y)?1:0)) : gr.tasks;
      L.push(`[[red|${no} ${gr.sj.toUpperCase()}${eps.length ? ' (' + eps.map(partName).join(', ').toUpperCase() + ')' : ''} – ÔN TẬP / KIỂM TRA]]${sl.tag}`, ...tks.filter(t => !other(t)).map(tl), gr.tasks.some(t => /-decuong-GK1-[AB]$/.test(t.keyId||'')) ? '   – **Cách ôn:** che đáp án, làm theo đề cương như đi thi → đưa ba chấm (ba có lời giải) → chữa lại câu sai, đọc to lại phần tự luận.' : '   – **Cách ôn:** đọc lại vở ghi → học thuộc và tự nói to các dòng có ⭐ ở mục 1 → ý nào chưa nói được thì xem lại vở.', ...(eps.includes('HH') ? ['   – **Hình học:** tự vẽ lại từng hình đã học bằng thước và ê ke, vừa vẽ vừa nói tính chất của hình.'] : []), ...tks.filter(other).map(tl));
      return; }
    const dTm = gr.tasks.some(t => t.due===tm);
    L.push(`[[${col}|${no} ${gr.sj.toUpperCase()}]]${dTm ? ` – nộp **${fmt(tm)}**` : ''}${sl.tag}`, ...gr.tasks.map(t => `   – [${SRC[t.source]||'Vở'}] ${u(t.content)}${tagOf(t)}`));
  });
  if (SP) SP.groups = groups.map((gr, i) => { const blk = L.slice(SP._gs[i], SP._gs[i+1] ?? L.length).map(msgPlain).filter(x => x.trim());
    const tm0 = (blk[0]||'').match(/⏱\s*([\d:]+)–([\d:]+)\s*\(~(\d+) phút\)/);
    return {no: i+1, subject: gr.sj, title: (blk[0]||'').replace(/\s*⏱.*$/, '').replace(/^\S+\s/, ''), exam: !!gr.exam, hot: !!gr.hot, start: tm0 ? tm0[1] : '', end: tm0 ? tm0[2] : '', min: tm0 ? +tm0[3] : 0,
      hints: blk.filter(x => /^\s+– (Cách ôn|Làm bài|Hình học|Số học)/.test(x)).map(x => x.replace(/^\s+–\s*/, '')),
      tasks: gr.tasks.map(t => ({id: t.id, src: SRC[t.source]||'Vở', text: u(t.content), tag: msgPlain(tagOf(t)).replace(/[()]/g, '').trim(), status: t.status||'todo', doneAt: t.doneAt||'', kidMark: t.kidMark||'', kidAt: t.kidAt||'', fromKid: !!t.fromKid, snap: spSnap(t)}))}; });
  const later = deferred.map(t => ({t, doDay: workDay(t.due)})).concat(notYet.map(t => ({t, doDay: t.due ? workDay(t.due) : workDay(nextLesson(t.subject, day))}))).concat(laterDebts);
  const SHOW_DEADLINE = false;   // tam an muc Ghi vao lich Deadline (ba se bao khi mo lai)
  if (SHOW_DEADLINE && later.length){
    L.push('', '[[purple|⏭️ GHI VÀO LỊCH DEADLINE]]', exam ? 'Hôm nay dành thời gian ôn tập. Các bài sau con ghi vào lịch Deadline, đúng ngày phải làm xong:' : 'Chưa cần làm hôm nay (hôm nay và ngày mai không có tiết môn này). Con ghi vào lịch Deadline, đúng ngày phải làm xong:');
    later.sort((a,b)=>String(a.doDay).localeCompare(String(b.doDay))).forEach(({t, doDay, debt}) => L.push(`• [[purple|Chiều ${fmt(doDay)}]]: **${t.subject}** [${SRC[t.source]||'Vở'}] ${u(t.content)}${t.due?` (${debt?'nợ, hạn cũ ':'nộp '}${fmt(t.due)})`:''}`));
  }
  if (!open.length) L.push('', 'Chưa có bài mới từ cô. Con kiểm tra eNetViet, có bài thì báo ba/mẹ nhé.');
  if (mem.length){ if (SP) SP.memo = true;
    const nQ = mem.reduce((n,x) => n + Math.min(6, (x.key.memorize||[]).length || (x.key.quiz||[]).length), 0), slm = slot(Math.max(10, nQ * 3));
    L.push('', ...slm.pre, `[[blue|🧠 HỌC THUỘC – làm sau bài tập]]${slm.tag}`, 'Gấp vở, tự nói lại to từng dòng có ⭐ ở mục 1 → ý nào chưa nói được thì mở vở/SGK xem lại rồi nói lại. Tối ba hỏi bài.');
  }
  if (extraOld.length){ L.push('', `[[gray|➕ NẾU CÒN THỜI GIAN – trả nợ bài cũ ba giao thêm (sau khi xong hết nhiệm vụ trên${clk!=null && clk < END ? ', còn khoảng '+(END-clk)+' phút trước 17:00' : ''})]]`); extraOld.forEach(t => L.push(`• **${t.subject}** [${SRC[t.source]||'Vở'}] ${u(t.content)}`)); }
  const subs = [...new Set(tkbOf(tm)[dow(tm)].filter(p=>p.s!=='SH').map(p=>p.s))];
  const endWork = clk;
  L.push('', `**🎒 ${w>=1&&w<=5 && (endWork==null || endWork<=END)?'17:00 ':''}Soạn cặp cho ${fmt(tm)}:** ${subs.join(', ')}.${PREP[dow(tm)].items!=='—'?' Mang thêm: '+PREP[dow(tm)].items+'.':''}`);
  L.push('✅ **17:30 Tự kiểm tra:** dò lại **từng dòng nhiệm vụ ba giao ở trên**, mở vở/sách xem đã làm đủ chưa, rồi đánh dấu: [[green|✓]] xong đủ · [[yellow|◯]] xong nhưng chưa chắc đúng · [[red|✗]] chưa xong / không làm được. **18:00 báo ba/mẹ:** bài nào [[yellow|◯]], [[red|✗]] và còn thiếu phần nào.');
  L.push('💡 Bài nào không làm được thì đánh [[red|✗]] nhanh rồi làm bài khác, không ngồi lâu kéo dài.');
  if (S.msgNote.trim()) L.push('', '**💬 ' + u(S.msgNote.trim()) + '**');
  if (SP){ const bi = L.findIndex(x => /Soạn cặp/.test(x)); SP.tail = (bi >= 0 ? L.slice(bi) : []).map(msgPlain).filter(x => x.trim()); }
  return L.join('\n');
}

    <div class="filters" role="group" aria-label="Lọc">${[['open','Đang mở'],['debt','Nợ'],['backlog','Nợ bài cũ'],['done','Đã xong'],['all','Tất cả']].map(([k,n])=>`<button data-act="filter" data-v="${k}" aria-pressed="${f===k}">${n} · ${counts[k]}</button>`).join('')}</div>

function sleepH(lo){ if(!lo) return null; const [h,m]=lo.split(':').map(Number); const mins=(24*60-(h*60+m))+(5*60+40); return h<12 ? null : mins/60; }
function weekStats(mon){
  const days = [...Array(7)].map((_,i)=>addDays(mon,i)), sun = days[6];
  const assigned = S.tasks.filter(t=>t.assigned>=mon && t.assigned<=sun);
  const dueIn = S.tasks.filter(t=>t.due && t.due>=mon && t.due<=sun);
  const upto = S.cur < sun ? S.cur : sun;
  const dueDone = dueIn.filter(t=>t.status==='done').length;
  const overdue = dueIn.filter(t=>isOpen(t) && t.due<=upto);
  const bySub = {};
  assigned.forEach(t=>{ const b = bySub[t.subject] || (bySub[t.subject]={n:0,help:0}); b.n++; if(t.everHelp) b.help++; });
  const causes = {A:0,B:0,C:0,D:0}; S.tasks.filter(t=>t.cause && t.due>=mon && t.due<=sun).forEach(t=>causes[t.cause]++);
  const webMiss = S.tasks.filter(t=>t.source==='W' && t.due>=mon && t.due<=upto && isOpen(t)).length;
  const logs = days.map(d=>({d, ...(S.logs[d]||{})}));
  const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
  const avg = a => { const x=a.filter(v=>v!=null); return x.length ? x.reduce((s,v)=>s+v,0)/x.length : null; };
  const total = l => { const a=num(l.minAft), e=num(l.minEve); return a==null&&e==null ? null : (a||0)+(e||0); };
  const helpTotal = Object.values(bySub).reduce((s,b)=>s+b.help,0);
  const flags = [];
  const heavyDays = logs.filter(l=>(total(l)||0)>150).length;
  if (heavyDays>=2) flags.push(['Tự học trên 150 phút ở '+heavyDays+' ngày','Bỏ P3, xem môn nào giao nhiều; kéo dài 2 tuần thì trao đổi GV.']);
  const shortSleep = logs.filter(l=>dow(l.d)!==6 && sleepH(l.lightsOff)!=null && sleepH(l.lightsOff)<8).length;
  if (shortSleep>=2) flags.push(['Ngủ đêm dưới 8 giờ ở '+shortSleep+' đêm','Dời giờ tắt đèn sớm hơn, giữ ngủ trưa 45–60 phút, xem lại tối T3/T5.']);
  const tired = logs.filter(l=>num(l.fatigue)>=4).map(l=>SHORT[dow(l.d)]);
  if (tired.length) flags.push(['Mệt mức 4–5 vào: '+tired.join(', '),'Nếu lặp lại cùng thứ ở tuần sau, giảm tải ngày đó và dời bài sang chiều T4 hoặc CN.']);
  Object.entries(bySub).forEach(([s,b])=>{ if (helpTotal>=3 && b.help/helpTotal>0.4) flags.push([s+' chiếm '+Math.round(b.help/helpTotal*100)+'% số lần cần giúp','Đặt làm môn trọng tâm: ưu tiên khi kèm + 20 phút ôn riêng ngày CN.']); });
  if (overdue.length>=2) flags.push([overdue.length+' bài quá hạn chưa xong','Xem nguyên nhân: bắt đầu muộn (A) hay quá tải (B).']);
  if (webMiss) flags.push([webMiss+' bài eNetViet quá hạn','Thêm lượt kiểm tra eNetViet 20:00 hằng ngày trong 2 tuần.']);
  const coachT24 = avg(logs.filter(l=>[1,3].includes(dow(l.d))).map(l=>num(l.coach)));
  if (coachT24!=null && coachT24>45) flags.push(['Kèm T2/T4 trung bình '+Math.round(coachT24)+' phút','Kiểm tra con có làm “3 việc trước khi hỏi” không.']);
  if (causes.A>=3) flags.push(['Nợ do quên/trì hoãn: '+causes.A+' lần','Tuần sau xem Sổ kỹ hơn lúc 18:00 trong 1 tuần, rồi nới lại.']);
  const schoolLogs = logs.filter(l=>dow(l.d)>=1);
  const sentOk = schoolLogs.filter(l=>l.sent && l.sent<='12:15').length;
  const fixSum = schoolLogs.reduce((s,l)=>s+(num(l.fixes)||0),0);
  const fixDays = schoolLogs.filter(l=>l.fixes!==undefined && l.fixes!=='').length;
  if (sentOk>=5) flags.push(['Con gửi bài trước 12:15 ở '+sentOk+'/6 ngày','Đạt điều kiện giai đoạn 1 → có thể bắt đầu giai đoạn 2 (con tự điền Lịch Deadline).', true]);
  else if (schoolLogs.some(l=>l.sent)) flags.push(['Con gửi bài trước 12:15: '+sentOk+'/6 ngày','Cần ≥ 5/6 ngày để chuyển giai đoạn 2. Nhắc con gửi ngay khi về, trước khi ăn trưa.']);
  if (fixDays && fixSum<=1) flags.push(['Số chỗ ghi chú phải sửa trong tuần: '+fixSum,'Nếu giữ được 2 tuần liên tiếp → chuyển giai đoạn 3 (con tự đề xuất kế hoạch).', true]);
  else if (fixSum>1) flags.push(['Số chỗ ghi chú phải sửa trong tuần: '+fixSum,'Cùng con xem lại: cô không nói hạn → ô gần nhất có tên môn đó trong Lịch Deadline.']);
  const wk = {}; Object.values(S.checks).filter(c=>c.date>=mon && c.date<=sun).forEach(c => { const k = S.keys[c.keyId]; (c.wrong||[]).forEach(ex => { const an = k && ((k.answers||[]).find(x=>x.ex===ex || (subParts(x.a) && ex.startsWith(x.ex) && /^[a-h]$/.test(ex.slice(x.ex.length)))) || (/^Q\d+$/.test(ex) && (k.quiz||[])[+ex.slice(1)-1])); const sk = (an && an.skill) || (/^Q/.test(ex)?'hoc-thuoc':'khac'); const nm = (k ? k.subject+' – ' : '') + skillName(sk); wk[nm] = (wk[nm]||0)+1; }); });
  Object.entries(wk).filter(([,n])=>n>=2).forEach(([nm,n]) => flags.push([nm+': sai '+n+' câu trong tuần','Đưa dạng này vào buổi kèm tối T2/T4 và ghi vào mục Điểm yếu.']));
  if (causes.B>=2) flags.push(['Nợ do quá tải: '+causes.B+' lần','Giảm P3, rải P2; theo dõi thêm 1 tuần trước khi trao đổi GV.']);
  return {days, logs, assigned, dueIn, dueDone, overdue, bySub, causes, flags,
    avgStudy: avg(logs.map(total)), avgCoach: avg(logs.map(l=>num(l.coach))), avgSleep: avg(logs.filter(l=>dow(l.d)!==6).map(l=>sleepH(l.lightsOff))), avgFat: avg(logs.map(l=>num(l.fatigue))), helpTotal};
}

// TX he so 1 (mieng/qua trinh, 15 phut, 1 tiet...), GK he so 2, CK he so 3: DTBhk = (tong TX + 2GK + 3CK) / (so TX + 5)
const SC_TYPES = [['txm','Miệng / quá trình','TX'],['tx15','Kiểm tra 15 phút','TX'],['tx45','Kiểm tra 1 tiết','TX'],['gk','Giữa kỳ','GK'],['ck','Cuối kỳ','CK'],['cong','Điểm cộng','+']];
const SC_NAME = Object.fromEntries(SC_TYPES.map(([k,n]) => [k,n]));
const SC_KIND = Object.fromEntries(SC_TYPES.map(([k,,c]) => [k,c]));
const SC_SUBJ = ['Toán','Văn','Tiếng Anh','KHTN','LS&ĐL','Tin học','Công nghệ','GDCD','Âm nhạc','Mĩ thuật','Thể dục','HĐTN','GDĐP'];
const SC_COMMENT = new Set(['Âm nhạc','Mĩ thuật','Thể dục','HĐTN','GDĐP']);   // danh gia bang nhan xet: Dat / Chua dat
const hkOf = d => { const y = +String(d).slice(0,4), m = +String(d).slice(5,7), d2 = +String(d).slice(8,10); const sy = m >= 8 ? y : y - 1; return (m >= 8 || (m === 1 && d2 <= 15)) ? `HK1 ${sy}–${sy+1}` : `HK2 ${sy}–${sy+1}`; };
const perWeek = sj => Object.values(tkbOf(S.cur)).reduce((n, day) => n + day.filter(p => p.s===sj).length, 0);
const minTX = sj => { const y = perWeek(sj) * 35; return y > 70 ? 4 : y > 35 ? 3 : 2; };
const fmtSc = v => typeof v === 'number' ? String(Math.round(v*100)/100).replace('.',',') : String(v);
const scLevel = v => v >= 8 ? ['Tốt','var(--ok)'] : v >= 6.5 ? ['Khá','var(--accent)'] : v >= 5 ? ['Đạt','var(--p2)'] : ['Chưa đạt','var(--p1)'];
function scSummary(sj, hk){
  const L = S.scores.filter(x => x.subject===sj && (x.hk || hkOf(x.date))===hk).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const num = x => typeof x.value === 'number';
  const tx = L.filter(x => SC_KIND[x.type]==='TX' && num(x)), gk = L.find(x => x.type==='gk' && num(x)), ck = L.find(x => x.type==='ck' && num(x));
  const cong = L.filter(x => x.type==='cong'), plus = cong.reduce((n,x) => n + (+x.value || 0), 0);
  const sTX = tx.reduce((n,x) => n + x.value, 0);
  let avg = null, temp = false;
  if (gk && ck) avg = (sTX + 2*gk.value + 3*ck.value) / (tx.length + 5);
  else if (tx.length || gk){ avg = (sTX + (gk ? 2*gk.value : 0)) / (tx.length + (gk ? 2 : 0)); temp = true; }
  return {L, tx, gk, ck, cong, plus, avg, temp};
}

  const hks = [...new Set(S.scores.map(x => x.hk || hkOf(x.date)).concat([hkOf(S.cur)]))].sort();
  const hk = S.scHK && hks.includes(S.scHK) ? S.scHK : hkOf(S.cur);

  return `<div class="stack">

      <label class="f">${dr.type==='cong'?'Điểm cộng (vd 0,5 hoặc 1)':isCmt?'Kết quả (Đ / CĐ hoặc điểm)':'Điểm (0–10)'}<input type="text" inputmode="decimal" data-scd="value" value="${esc(dr.value)}" placeholder="${dr.type==='cong'?'1':isCmt?'Đ':'8,5'}"></label>

const EX_FULL = [[/^KĐ$/,'Khởi động'],[/^HĐ\s*/,'Hoạt động '],[/^CH\s*/,'Câu hỏi '],[/^\?\s*/,'Câu hỏi '],[/^LT\s*/,'Luyện tập '],[/^VD\s*/,'Vận dụng '],[/^TL\s*/,'Tự luận '],[/^TN(?=\d)/,'Trắc nghiệm '],[/^TN$/,'Thí nghiệm']];
const exLabel = ex => { let x = String(ex||''); for (const [re, rep] of EX_FULL) if (re.test(x)) { x = x.replace(re, rep).trim(); break; } return x.replace(/(^|\s)BĐ(?=\s|$)/g,'$1bản đồ').replace(/\bTG\b/g,'thế giới').replace(/\bVN\b/g,'Việt Nam'); };
const skillName = k => SKILL[k] || k || 'Khác';
const keyId = (sj, book, no) => `${SLUG[sj]||'khac'}-${book.toLowerCase()}-${String(no).replace(/[^A-Za-z0-9_.~:@+-]/g,'_')}`;
// LS&DL: phan nao can on cho bai KT sap toi. Uu tien phan ghi tren nhiem vu KT; neu khong ghi thi bo phan vua kiem tra xong trong 7 ngay qua.
// Phan cua mot bai kiem tra: ghi tren nhiem vu > bai gan voi nhiem vu > chu trong noi dung > (Toan) ngay kiem tra: thu Sau = Hinh hoc
function examPartOf(sj, t){
  const p = t.part || partOf(sj, t.lessonNo||''); if (p) return p;
  const txt = String(t.content||'') + ' ' + String(t.note||'');
  if (sj==='Toán' && /giữa kì|cuối kì|học kì|giữa kỳ|cuối kỳ|học kỳ/i.test(txt)) return '';   // thi ki: ca Hinh hoc + So hoc
  if (sj==='Toán') return /hình học|hình/i.test(txt) ? 'HH' : /số học|đại số|số nguyên|phân số|số tự nhiên|chia hết/i.test(txt) ? 'SH' : (t.due && dayParts(sj, t.due).length === 1 ? dayParts(sj, t.due)[0] : '');
  if (sj==='LS&ĐL') return /lịch sử/i.test(txt) && !/địa l[íý]/i.test(txt) ? 'LS' : /địa l[íý]/i.test(txt) && !/lịch sử/i.test(txt) ? 'DL' : '';
  return '';
}
function examParts(sj){
  const act = S.tasks.filter(t => t.subject===sj && examActive(t, S.cur));
  const named = [...new Set(act.map(t => examPartOf(sj, t)).filter(Boolean))];
  if (named.length) return named;
  if (sj==='Toán') return ['SH','HH'];
  const tested = new Set(S.tasks.filter(t => t.subject===sj && isExam(t) && !isOpen(t) && t.due && t.due <= S.cur && diff(t.due, S.cur) <= 7).map(t => t.part || partOf(sj, t.lessonNo||'')).filter(Boolean));
  const rest = ['LS','DL'].filter(p => !tested.has(p));
  return rest.length ? rest : ['LS','DL'];

async function genKey(){
  const tg = gradeTargets(S.cur, true).filter(x => !x.key);
  const x = tg.find(t => t.id === S.keyPick) || tg[0];
  if (!x || !S.keyImgs || !S.sample) { S.keyErr = 'Chọn bài và ảnh trang bài tập trước.'; render(); return; }
  S.keyBusy = true; S.keyErr = ''; render();
  const prompt = `Ảnh là trang ${x.book==='SGK'?'sách giáo khoa':'sách bài tập'} môn ${x.sj} lớp 6 (bộ Kết nối tri thức), ${lessonLabel(x.L)}.
Soạn tài liệu chấm bài cho phụ huynh. Trả về DUY NHẤT JSON:
{"knowledge": [4–8 ý kiến thức trọng tâm theo thứ tự trong bài, mỗi ý 1 câu ngắn, KHÔNG có hai ý trùng nội dung],
 "knowMust": [mảng true/false cùng độ dài với knowledge: true nếu ý đó học sinh PHẢI HỌC THUỘC (định nghĩa, khái niệm, mốc thời gian, công thức, từ vựng)],
 "mistakes": [2–4 lỗi học sinh hay mắc],
 "review": {mã dạng bài: "1 câu kiến thức cần ôn lại khi sai dạng này"},
 "quiz": [4–6 câu hỏi miệng để phụ huynh kiểm tra bài cũ: {"q": câu hỏi ngắn, "a": ý chính cần trả lời, "skill": mã dạng}],
 "outline": [CHỈ khi có bài viết văn/viết đoạn: dàn bài gợi ý, mỗi ý 1 dòng; ngược lại []],
 "sample": CHỈ khi có bài viết văn/viết đoạn: một bài mẫu ngắn (250–350 chữ) đúng yêu cầu, lời văn học sinh lớp 6; ngược lại "",
 "answers": [{"ex": số hiệu câu đúng như trong sách (vd "1.46" hoặc "Câu 2"), "q": đề bài chép ngắn gọn (giữ đủ dữ kiện và các phương án A/B/C/D nếu có), "a": đáp án ngắn gọn (ghi kết quả cuối, kèm bước chính nếu là bài tính), "why": 1–2 câu giải thích VÌ SAO chọn/ra đáp án đó (với trắc nghiệm: vì sao các phương án khác sai), "skill": một mã trong ${Object.keys(SKILL).join(', ')} hoặc mã ngắn tự đặt}]}
Giải cẩn thận từng câu, tính lại trước khi ghi đáp án. Câu nào không đọc rõ đề thì bỏ qua. Môn thiên về học thuộc (Lịch sử, Địa lí, KHTN, GDCD, Văn, Tiếng Anh) phải có ý cần thuộc (knowMust true) và quiz; answers có thể rỗng nếu ảnh không có bài tập.`;
  try{
    const out = await S.sample.json(prompt, {images: Array.from(S.keyImgs).slice(0, S.imgMax||5), modelTier:'complex'});
    const body = {subject:x.sj, book:x.book, lesson:String(x.L.no), title:lessonLabel(x.L), pages:lessonPages(x.L),
      knowledge:(out.knowledge||[]).map(String).slice(0,8), knowMust:(out.knowledge||[]).slice(0,8).map((_, i) => !!(out.knowMust||[])[i]), mistakes:(out.mistakes||[]).map(String).slice(0,6), review:(out.review && typeof out.review==='object')?out.review:{},
      memorize:(out.knowledge||[]).slice(0,8).map(String).filter((_, i) => !!(out.knowMust||[])[i]), outline:(out.outline||[]).map(String).slice(0,12), sample:String(out.sample||'').slice(0,4000), quiz:(out.quiz||[]).filter(q=>q&&q.q).map(q=>({q:String(q.q), a:String(q.a||''), skill:String(q.skill||'hoc-thuoc')})).slice(0,8),
      answers:(out.answers||[]).filter(a=>a&&a.ex).map(a=>({ex:String(a.ex), q:String(a.q||''), a:String(a.a||''), why:String(a.why||''), skill:String(a.skill||'khac')})).slice(0,60),
      verified:false, source:'Claude trong app soạn từ ảnh ngày '+fmt(S.cur)+' – chưa kiểm tra lại'};
    await setDoc('keys', x.id, body); S.keyImgs = null; toast('Đã soạn lời giải '+lessonLabel(x.L));
  }catch(e){ S.keyErr = e && e.code==='not_granted' ? 'Cần cho phép trang dùng Claude.' : 'Chưa soạn được. Thử ảnh rõ hơn hoặc nhắn Claude trong cuộc trò chuyện.'; }
  finally{ S.keyBusy = false; render(); }
}

async function saveSbtLessons(sj, newLessons, perDay, book){
  book = book || S.sbtBook;
  const id = catId(sj, book), cur = S.sbt[id] || {subject:sj, book, lessons:[], perDay: book==='SGK'?5:3};
  const map = {}; (cur.lessons||[]).forEach(l=>map[String(l.no)] = l);
  if (book==='SGK') newLessons = newLessons.map(l => { const x = {...l}; if (x.sbtPages) { x.sgkPages = x.sbtPages; delete x.sbtPages; } return x; });
  newLessons.forEach(l=>{ const k=String(l.no); map[k] = {...(map[k]||{}), ...Object.fromEntries(Object.entries(l).filter(([key,v])=> key!=='use' && (Array.isArray(v) ? v.length : v!=='' && v!=null)))}; });
  const lessons = Object.values(map).sort((a,b)=>lessonOrd(a)-lessonOrd(b) || String(a.no).localeCompare(String(b.no)));
  await setDoc('sbt', id, {...cur, subject:sj, book, lessons, perDay: perDay || cur.perDay || (book==='SGK'?5:3)});
}
async function parseSbt(){
  if (!S.sample || !S.sbtImgs) return;
  S.sbtParsing = true; S.sbtErr = ''; render();
  const sj = S.sbtSubj;
  const prompt = `Các ảnh là trang ${S.sbtBook==='SGK'?'Sách giáo khoa (SGK)':'Sách bài tập (SBT)'} hoặc mục lục môn ${sj} lớp 6 (Việt Nam). Trích xuất danh sách các bài.
Trả về DUY NHẤT một JSON array. Mỗi phần tử:
{"chapter": tên hoặc số chương nếu thấy, ngược lại "", "no": số bài dạng chuỗi (vd "7"), "title": tên bài, "sbtPages": trang trong SBT (vd "tr.12–13") nếu thấy, ngược lại "", "ex": mảng số hiệu các câu/bài tập đúng như ký hiệu trong sách (vd ["7.1","7.2"]) nếu ảnh có trang bài tập, ngược lại []}
Chỉ ghi những gì thấy trong ảnh, không tự bịa số câu.`;
  try{
    const imgs = Array.from(S.sbtImgs).slice(0, (S.imgMax||5));
    const out = await S.sample.json(prompt, {images: imgs});
    const arr = Array.isArray(out) ? out : [];
    S.sbtRows = arr.filter(x=>x && x.no!=null).map(x=>({use:true, chapter:String(x.chapter||''), no:String(x.no).replace(/^b(à|a)i\s*/i,''), title:String(x.title||''), sbtPages:String(x.sbtPages||''), ex:(Array.isArray(x.ex)?x.ex:[]).map(String).slice(0,40)}));
    if (!S.sbtRows.length) S.sbtErr = 'Không đọc được bài nào trong ảnh. Thử chụp rõ và thẳng hơn.';
  }catch(e){
    S.sbtErr = e && e.code==='not_granted' ? 'Cần cho phép trang dùng Claude. Tải lại trang và chọn Cho phép.' : e && e.code==='image_rejected' ? 'Ảnh quá lớn hoặc sai định dạng. Thử ảnh nhỏ hơn.' : 'Chưa đọc được ảnh. Thử lại sau.';
  }finally{ S.sbtParsing = false; render(); }
}

  switch(d.act){

      }
      const t = S.tasks.find(x=>x.id===d.id); if (!t) break;
      try{ await updTask(d.id, patch); }catch(x){ fail(x); } break; }
    case 'noSBT': {
      const vt = defaultSBT(S.cur).find(x=>x.id===d.id); if (!vt) break;
      try{ await addSkipAuto([autoKey(vt.subject, vt.due, vt.source)]); toast('Đã bỏ bài tự động '+vt.subject+' ['+vt.book+']'); }catch(x){ fail(x); } break; }
    case 'drop': try{ await updTask(d.id,{status:'dropped', doneAt:S.cur}); toast('Đã bỏ bài P3'); }catch(x){ fail(x); } break;
    case 'copy': {

      try{
        if (window.ClipboardItem && navigator.clipboard.write){
          try{ await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([plain],{type:'text/plain'})})]); }
          catch(e1){ await navigator.clipboard.writeText(plain); }
        } else await navigator.clipboard.writeText(plain);
        { const n = new Date(); S.copiedAt[S.cur] = `${n.getHours()}:${String(n.getMinutes()).padStart(2,'0')}`; }

    case 'filter': S.filter = d.v; render(); break;

    case 'askDel': S.confirmDel = d.id; render(); break;
    case 'cancelDel': S.confirmDel = null; render(); break;
    case 'del': try{
      const t = S.tasks.find(x => x.id===d.id);
      await delTask(d.id);

      if (t && !t.backlog && t.due && (t.source==='G' || t.source==='S') && AUTO_SUBJECTS.includes(t.subject)) await addSkipAuto([autoKey(t.subject, t.due, t.source)]);

    case 'addManual': {
      const m = S.manual; if (!m.content.trim()){ toast('Nhập nội dung bài trước'); break; }
      const due = m.due || nextLesson(m.subject, S.cur);
      try{ await addTask({subject:m.subject, source:m.source, content:m.content.trim(), due, extra:!!m.extra, exam:!!m.exam, assigned:S.cur, note:''}); S.manual = {subject:m.subject, source:'V', content:'', due:'', extra:false, exam:false}; toast('Đã thêm bài '+m.subject); }catch(x){ fail(x); }
      break; }
    case 'saveRows': {
      const use = S.rows.filter(r=>r.use && r.content.trim());
      if (!use.length && !S.progRows.some(r=>r.use)) break;
      const pro = S.progRows.filter(r=>r.use && r.lesson);
      try{ for (const r of use){ await addTask({subject:r.subject, source:r.source, content:r.content.trim(), due:r.due||nextLesson(r.subject,S.cur), extra:!!r.extra, exam:!!r.exam, assigned:S.cur, note:r.note||''}); }
        for (const r of pro){ await setDoc('progress', S.cur+'_'+(SLUG[r.subject]||'khac'), {date:S.cur, subject:r.subject, lesson:r.lesson, pages:r.pages, title:r.title||'', part:r.part||'', done:r.done!==false}); }
        S.rows=[]; S.progRows=[]; S.paste=''; S.img=null; toast('Đã lưu '+use.length+' bài'+(pro.length?' + tiến độ '+pro.length+' môn':'')); }catch(x){ fail(x); }
      break; }
    case 'parse': parseMessage(); break;
    case 'grade': {
      const id = S.cur+'_'+d.k, cur = S.checks[id] || {date:S.cur, keyId:d.k, wrong:[], ok:[]};
      const wrong = new Set(cur.wrong||[]), ok = new Set(cur.ok||[]);
      if (d.v==='wrong'){ if (wrong.has(d.ex)) wrong.delete(d.ex); else { wrong.add(d.ex); ok.delete(d.ex); } }
      else { if (ok.has(d.ex)) ok.delete(d.ex); else { ok.add(d.ex); wrong.delete(d.ex); } }
      try{ await setDoc('checks', id, {date:S.cur, keyId:d.k, wrong:[...wrong], ok:[...ok]}); }catch(x){ fail(x); }
      break; }
    case 'lsdlPart': try{ await metaMerge({lsdlPart: {[nextSchool(S.cur)]: d.v}}); }catch(x){ fail(x); } break;
    case 'lsdlSaveLast': {
      const no = S.lsdlLast; if (!no){ toast('Chọn bài trước'); break; }
      // ghi vao buoi LS&DL gan nhat truoc hom nay chua co tien do
      const cur = partForLesson('LS&ĐL', nextSchool(S.cur)), old = lastProgress('LS&ĐL', S.cur, cur).pr;
      if (old && /ba nhập bù/.test(old.note||'')){ try{ const {id:_i, ...body} = old; await setDoc('progress', old.date+'_lsdl', {...body, lesson:no}); S.lsdlLast=''; toast('Đã sửa thành '+no); }catch(x){ fail(x); } break; }
      let dt = null; for (let i=1;i<=21;i++){ const x = addDays(S.cur,-i), q = dow(x); if (q && tkbOf(x)[q].some(p=>p.s==='LS&ĐL') && !S.progress.some(p=>p.subject==='LS&ĐL' && p.date===x)) { dt = x; break; } }
      if (!dt){ toast('Không tìm được buổi trống để ghi'); break; }
      try{ await setDoc('progress', dt+'_lsdl', {date:dt, subject:'LS&ĐL', lesson:no, pages:'', part:'', done:true, note:'ba nhập bù'}); S.lsdlLast=''; toast('Đã lưu '+no+' (buổi '+fmt(dt)+')'); }catch(x){ fail(x); }
      break; }
    case 'gradeAll': {
      const id = S.cur+'_'+d.k, cur = S.checks[id] || {date:S.cur, keyId:d.k, wrong:[], ok:[]}, subs = d.subs.split('|');
      const wrong = new Set(cur.wrong||[]), ok = new Set(cur.ok||[]), all = subs.every(e => ok.has(e));
      subs.forEach(e => { if (all) ok.delete(e); else { ok.add(e); wrong.delete(e); } });
      try{ await setDoc('checks', id, {date:S.cur, keyId:d.k, wrong:[...wrong], ok:[...ok]}); }catch(x){ fail(x); }

        toast(d.act==='cancelSj' ? `Đã ghi: hôm nay không học ${d.sj} – bài môn này giữ theo buổi học trước` : `Đã hoàn tác ${d.sj}`); }catch(x){ fail(x); }

    case 'offAdd': {

      break; }
    case 'offDel': {

        const back = S.tasks.filter(t => t.dueShiftFrom===d.d); for (const t of back) await updTask(t.id, {due: d.d, dueShiftFrom: ''});
        toast('Đã bỏ ngày nghỉ ' + fmt(d.d) + (back.length ? ' · trả lại hạn cũ cho ' + back.length + ' bài' : '')); }catch(x){ fail(x); }

        const keys = {};
        r.mem.forEach(x => S.progress.filter(p => p.subject===x.sj && String(p.lesson)===String(x.L.no) && p.date <= S.cur).forEach(p => { const u = unitOf(p, S.cur); if (u.plan === S.cur || u.eve === S.cur) keys[p.subject+'|'+p.lesson+'|'+p.date] = D; }));

    case 'clearPlan': try{ await updTask(d.id, {planDay: ''}); }catch(x){ fail(x); } break;
    case 'hideKeys': S.hideKeys = !S.hideKeys; try{ localStorage.setItem('hideKeys', S.hideKeys?'1':'0'); }catch(x){} render(); break;
    case 'scEdit': { const x = S.scores.find(y => y.id===d.id); if (!x) break; S.scEdit = x.id; S.scConfirm = null; S.scDraft = {subject:x.subject, type:x.type, value:fmtSc(x.value), date:x.date, note:x.note||''}; render(); window.scrollTo(0,0); break; }

      const id = S.scEdit || ('sc' + Date.now().toString(36));

    case 'msgToggle': S.msgOpen[S.cur] = S.msgOpen[S.cur] === false; render(); break;
    case 'progToggle': { const cur = S.progOpen[S.cur] !== undefined ? S.progOpen[S.cur] : !document.querySelector('[data-act=progToggle]').textContent.includes('Mở'); S.progOpen[S.cur] = !cur; render(); break; }

        Object.values(dr).forEach(v => { delete v._dirty; });
        toast(n ? 'Đã lưu tiến độ '+n+' môn' : 'Chưa nhập bài số nào'); render(); }catch(x){ fail(x); }
      break; }
    case 'sbtBook': S.sbtBook = d.v; S.sbtRows = []; S.sbtErr=''; S.sbtImgs=null; render(); break;
    case 'sbtSubj': S.sbtSubj = d.v; S.sbtRows = []; S.sbtErr=''; S.sbtImgs=null; render(); break;

/* ============ CLAUDE: DOC TIN NHAN ============ */
async function parseMessage(){
  if (!S.sample) return;
  if (!S.paste.trim() && !S.img){ S.parseErr = 'Dán tin nhắn hoặc chọn ảnh trước.'; render(); return; }
  S.parsing = true; S.parseErr = ''; render();
  const day = S.cur, w = dow(day);
  const tkb = Object.entries(tkbOf(addDays(day,1))).map(([k,ps])=>`${SHORT[k]}: ${ps.map(p=>p.s).join(', ')}`).join('\n');
  const prompt = `Bạn đọc thông báo bài tập giáo viên lớp 6A14 (THCS, Việt Nam) gửi phụ huynh qua Zalo và tách thành từng bài.
Hôm nay: ${DAYS[w]}, ngày ${day} (định dạng YYYY-MM-DD). Học sáng thứ Hai đến thứ Bảy.
Thời khoá biểu:
${tkb}
Danh sách môn hợp lệ: ${SUBJECTS.join(', ')}. ("Văn" = Ngữ văn; "LS&ĐL" = Lịch sử và Địa lí; "KHTN" = Khoa học tự nhiên.)

Trả về DUY NHẤT một JSON object dạng {"tasks": [...], "progress": [...]}.
Mỗi phần tử của "tasks":
{"subject": môn trong danh sách, "source": "V" nếu làm vào vở hoặc SGK, "S" nếu là sách bài tập (SBT), "W" nếu làm trên website/eNetViet/online, "P" nếu là sản phẩm phải nộp riêng (bài vẽ, thiệp, mô hình, poster, bài thuyết trình, báo cáo, sưu tầm…), "H" nếu chỉ là ôn tập/học thuộc/chuẩn bị kiểm tra, không có bài viết, "content": mô tả ngắn bằng tiếng Việt, giữ nguyên số bài/số trang, "due": "YYYY-MM-DD" nếu tin nói rõ hạn hoặc thứ (quy đổi theo ngày hôm nay), ngược lại null, "extra": true nếu là bài làm thêm/không bắt buộc/khuyến khích, ngược lại false, "exam": true nếu là ôn tập để chuẩn bị kiểm tra/thi (kể cả kiểm tra chưa rõ ngày), ngược lại false, "note": ghi chú ngắn nếu có (kiểm tra, mang đồ…), ngược lại ""}
Thông báo không phải bài tập (lịch kiểm tra, mang đồ dùng) vẫn đưa vào với source "V" và content là nội dung thông báo.
Không đoán môn nếu tin không nói rõ: dùng "Khác". Không có bài nào thì "tasks": [].
"progress" là tiến độ học trên lớp nếu nội dung có ghi (vd: sổ ghi chú của con "Toán: bài 7, trang 24–26"): mỗi phần tử {"subject": môn, "lesson": số bài dạng chuỗi (vd "7"), "title": tên bài nếu có, "pages": trang SGK nếu có, "part": mục/phần cụ thể đã học nếu sổ ghi (vd "Mục 2", "nửa đầu tr.25"), ngược lại "", "done": false nếu sổ cho thấy mới học một phần bài, ngược lại true}. Không có thì "progress": [].
${S.paste.trim() ? 'Tin nhắn:\n"""\n' + S.paste.trim().slice(0,8000) + '\n"""' : 'Nội dung nằm trong ảnh đính kèm (ảnh chụp tin nhắn hoặc bảng).'}`;
  try{
    const opts = {};
    if (S.img && S.imagesOK) opts.images = [S.img];
    const out = await S.sample.json(prompt, opts);
    const arr = Array.isArray(out) ? out : (out && Array.isArray(out.tasks) ? out.tasks : []);
    const parr = out && Array.isArray(out.progress) ? out.progress : [];
    S.progRows = parr.filter(x=>SUBJECTS.includes(x.subject) && x.lesson).map(x=>({use:true, subject:x.subject, lesson:String(x.lesson).replace(/^b(à|a)i\s*/i,''), pages:String(x.pages||''), title:String(x.title||''), part:String(x.part||''), done: x.done!==false}));
    S.rows = arr.map(x=>{
      const subject = SUBJECTS.includes(x.subject) ? x.subject : 'Khác';
      const due = /^\d{4}-\d{2}-\d{2}$/.test(x.due||'') ? x.due : nextLesson(subject, day);
      return {use:true, subject, source: ['V','S','W','H'].includes(x.source)?x.source:'V', content:String(x.content||'').slice(0,300), due, dueFixed: !!x.due, extra: !!x.extra, exam: x.exam===true || EXAM_RE.test(String(x.content||'')+' '+String(x.note||'')), note:String(x.note||'').slice(0,200)};
    });
    if (!S.rows.length && !S.progRows.length) S.parseErr = 'Không tìm thấy bài tập nào trong tin nhắn. Có thể nhập tay ở phần bên dưới.';
  }catch(e){
    S.parseErr = e && e.code==='not_granted' ? 'Cần cho phép trang dùng Claude để đọc tin. Tải lại trang và chọn Cho phép.'
      : e && e.code==='rate_limited' ? 'Claude đang bận. Đợi một phút rồi bấm lại.'
      : e && e.code==='invalid_json' ? 'Claude trả lời chưa đúng định dạng. Bấm Đọc tin nhắn lần nữa.'
      : 'Chưa đọc được tin nhắn. Kiểm tra mạng rồi thử lại, hoặc nhập tay.';
  }finally{ S.parsing = false; render(); }
}

/* ============ CLAUDE: GOI Y WEEKLY REVIEW ============ */
async function aiWeek(){
  if (!S.sample) return;
  const mon = monday(S.cur), st = weekStats(mon), rv = S.revDraft[mon] || {};
  S.aiBusy = true; render();
  const data = {
    tuan: mon, bai_den_han: st.dueIn.length, da_xong: st.dueDone, qua_han: st.overdue.map(t=>t.subject+': '+t.content),
    theo_mon: st.bySub, nguyen_nhan_no: st.causes, nhat_ky: st.logs.map(l=>({ngay:l.d, gui_trua:l.sent, sua_han:l.fixes, bat_dau:l.start, chieu:l.minAft, toi:l.minEve, kem:l.coach, tat_den:l.lightsOff, met:l.fatigue, ghi_chu:l.note})),
    tin_hieu: st.flags.map(f=>f[0]), con_tu_danh_gia: {lam_tot:rv.good, kho_nhat:rv.hard, muon_doi:rv.change}
  };
  const prompt = `Bạn là learning coach cho phụ huynh có con lớp 6 (Việt Nam). Hệ thống: con tự làm bài buổi chiều (3 block, ngủ trưa bắt buộc), 18:00 Daily Check, phụ huynh chỉ kèm phần con cần giúp; T3/T5 có Tiếng Anh Alokiddy học thêm online 20:00–21:00 (ngoài chương trình trường, chỉ ảnh hưởng thời gian); dậy 5:40. Ưu tiên: bền vững > lịch hoàn hảo, tự học > kiểm soát, giấc ngủ > bài thêm.
Dữ liệu tuần (JSON):
${JSON.stringify(data).slice(0,12000)}

Viết bằng tiếng Việt, ngắn gọn, văn bản thường (không markdown, không bảng):
1) 2 điểm tích cực cụ thể để khen con.
2) Tối đa 2 điều chỉnh cho tuần sau, mỗi điều chỉnh nêu lý do từ dữ liệu.
3) 1 điều phụ huynh nên làm ít đi.
Nếu dữ liệu còn ít, nói rõ và đề nghị ghi nhật ký đều hơn.`;
  try{
    const { text } = await S.sample(prompt, { onText: ({text}) => { S.ai[mon] = text; const el=document.querySelector('.ai'); if (el) el.textContent = text; else render(); } });
    S.ai[mon] = text;
  }catch(e){ S.ai[mon] = e && e.code==='not_granted' ? 'Cần cho phép trang dùng Claude.' : ((e && e.text) || 'Chưa lấy được gợi ý. Thử lại sau.'); }
  finally{ S.aiBusy = false; render(); }
}

  let info = {}, dirH = null, fileH = null, lastMod = 0, saveT = 0, cacheT = 0, saving = null;
  const subs = new Set(); let onReload = null;
  // ---- IndexedDB (ban sao tam + nho thu muc da chon) ----
  const idbOpen = () => new Promise((ok, no) => { const r = indexedDB.open('tro-ly-6a14', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  const kvGet = async k => { try{ const d = await idbOpen(); return await new Promise(ok => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(undefined); }); }catch(e){ return undefined; } };
  const kvSet = async (k, v) => { try{ const d = await idbOpen(); await new Promise(ok => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = ok; }); }catch(e){} };
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const pad = n => String(n).padStart(2, '0');

  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  // ---- thong bao cho cac man hinh dang theo doi ----

  let partial = false;

  const snapCol = col => { const docs = Object.keys(data[col]).sort().map(id => snapDoc(col, id)); return {docs, size: docs.length, empty: !docs.length, metadata: {fromCache: fc(), hasPendingWrites: false}, docChanges: () => []}; };
  const fire = s => { try{ s.id ? s.cb(snapDoc(s.col, s.id)) : s.cb(snapCol(s.col)); }catch(e){ console.error(e); } };
  const emit = col => subs.forEach(s => { if (s.col === col) fire(s); });
  // Nap ca file: phat 1 luot "chua day du" cho moi bang, roi moi phat ban day du (bai tap cuoi cung) -> khong tinh toan tren du lieu nua cu nua moi
  const emitAll = () => { partial = true; COLS.forEach(emit); partial = false; ['meta', 'sbt', 'progress', 'tasks'].forEach(emit); if (onReload) onReload(); };
  // ---- doc / ghi file ----
  const toJSON = () => { const o = {_info: {...info, app: 'Trợ lý 6A14', savedAt: new Date().toISOString()}}; COLS.forEach(c => o[c] = data[c]); return o; };
  const fromJSON = o => { info = o._info || {}; COLS.forEach(c => data[c] = (o && o[c] && typeof o[c] === 'object') ? o[c] : {}); };
  async function loadFile(){
    const f = await fileH.getFile();
    if (!f.size){ await writeFile(); return; }   // file moi tao: ghi du lieu dang co vao
    fromJSON(JSON.parse(await f.text())); lastMod = f.lastModified; st.dirty = false;
    await kvSet('cache', {json: JSON.stringify(toJSON()), dirty: false, baseMod: lastMod});
    emitAll();
  }
  const pend = new Set();   // cac dong da sua tu lan ghi truoc (de gop voi thay doi Claude ghi vao file cung luc)
  async function writeFile(){
    if (!fileH) return;
    let merged = false;
    try{ const f = await fileH.getFile();
      if (lastMod && f.size && f.lastModified !== lastMod){   // file vua bi sua o noi khac -> lay ban moi, ap lai cac dong app vua sua
        const o = JSON.parse(await f.text()), mine = {}; pend.forEach(k => { const [c, i] = k.split('/'); mine[k] = data[c] ? data[c][i] : undefined; });
        fromJSON(o); Object.entries(mine).forEach(([k, v]) => { const [c, i] = k.split('/'); if (!data[c]) data[c] = {}; if (v === undefined) delete data[c][i]; else data[c][i] = v; }); merged = true; } }catch(e){}
    pend.clear();
    const txt = JSON.stringify(toJSON(), null, 1);
    const w = await fileH.createWritable(); await w.write(txt); await w.close();
    lastMod = (await fileH.getFile()).lastModified; st.dirty = false; st.savedAt = stamp(); st.err = '';
    await kvSet('cache', {json: txt, dirty: false, baseMod: lastMod});
    if (merged) emitAll();
    // Moi ngay giu 1 ban sao luu trong thu muc sao-luu/ (khong bao gio xoa)
    try{ if ((await kvGet('bkDay')) !== today()){ const bd = await dirH.getDirectoryHandle('sao-luu', {create: true}); const bf = await bd.getFileHandle(today() + '_' + FN, {create: true}); const bw = await bf.createWritable(); await bw.write(txt); await bw.close(); await kvSet('bkDay', today()); } }catch(e){}
  }
  function scheduleSave(){
    st.dirty = true;
    clearTimeout(cacheT); cacheT = setTimeout(() => kvSet('cache', {json: JSON.stringify(toJSON()), dirty: true, baseMod: lastMod}), 300);
    if (st.status !== 'ok') return;
    clearTimeout(saveT); saveT = setTimeout(async () => { try{ saving = writeFile(); await saving; }catch(e){ st.err = 'Chưa ghi được file: ' + (e && e.message || e); } finally{ saving = null; if (typeof render === 'function') render(); } }, 700);
  }
  // Claude / may khac sua file -> nap lai (chi khi app khong co thay doi chua ghi)
  async function poll(){
    if (st.status !== 'ok' || !fileH || st.dirty || saving) return;
    try{ const f = await fileH.getFile(); if (f.lastModified !== lastMod && f.size){ fromJSON(JSON.parse(await f.text())); lastMod = f.lastModified; await kvSet('cache', {json: JSON.stringify(toJSON()), dirty: false, baseMod: lastMod}); emitAll(); if (typeof toast === 'function') toast('Đã nạp dữ liệu mới từ file'); } }catch(e){}
  }
  setInterval(poll, 5000); window.addEventListener('focus', poll);
  async function openDir(h){
    dirH = h; st.dirName = h.name; fileH = await h.getFileHandle(FN, {create: true});
    const c = await kvGet('cache'); const f = await fileH.getFile();
    if (c && c.dirty && f.size && f.lastModified === c.baseMod){ st.status = 'ok'; await writeFile(); }   // thay doi luc chua ket noi -> ghi vao file
    else { st.status = 'ok'; await loadFile(); }
    if (typeof render === 'function') render();
  }
  // ---- API giong window.claude db (de phan con lai cua app khong phai sua) ----
  const merge = (a, b) => { const o = {...(a || {})}; Object.entries(b || {}).forEach(([k, v]) => { o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? merge(o[k], v) : v; }); return o; };
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const docRef = path => { const [col, id] = path.split('/'); if (!data[col]) data[col] = {};
    return { id, path,
      get: async () => snapDoc(col, id),
      set: async v => { data[col][id] = clone(v); pend.add(col + '/' + id); emit(col); scheduleSave(); },
      update: async v => { if (data[col][id] === undefined){ const e = new Error('not found'); e.code = 'invalid_argument'; throw e; } data[col][id] = merge(data[col][id], clone(v)); pend.add(col + '/' + id); emit(col); scheduleSave(); },
      delete: async () => { delete data[col][id]; pend.add(col + '/' + id); emit(col); scheduleSave(); },
      onSnapshot: (cb) => { const s = {col, id, cb}; subs.add(s); setTimeout(() => fire(s), 0); return () => subs.delete(s); } }; };
  const db = {
    doc: docRef,
    collection: col => { if (!data[col]) data[col] = {};
      return { path: col, doc: id => docRef(col + '/' + (id || rid())),
        get: async () => snapCol(col),
        add: async v => { const id = rid(); data[col][id] = clone(v); pend.add(col + '/' + id); emit(col); scheduleSave(); return docRef(col + '/' + id); },
        onSnapshot: (cb) => { const s = {col, id: null, cb}; subs.add(s); setTimeout(() => fire(s), 0); return () => subs.delete(s); } }; }
  };
  return {
    db, st,
    set onReload(f){ onReload = f; },
    async start(){
      const c = await kvGet('cache'); if (c && c.json){ try{ fromJSON(JSON.parse(c.json)); st.dirty = !!c.dirty; }catch(e){} }
      if (!window.showDirectoryPicker){ st.status = 'nofs'; return db; }
      const h = await kvGet('dir');
      if (!h){ st.status = 'connect'; return db; }
      dirH = h; st.dirName = h.name;
      try{ if ((await h.queryPermission({mode: 'readwrite'})) === 'granted'){ await openDir(h); return db; } }catch(e){}
      st.status = 'permission'; return db;
    },
    async connect(){   // phai goi tu cu bam cua ba (trinh duyet yeu cau)
      try{ const h = await window.showDirectoryPicker({id: 'tro-ly-6a14', mode: 'readwrite'}); await kvSet('dir', h); await openDir(h); }
      catch(e){ if (e && e.name !== 'AbortError') st.err = 'Chưa mở được thư mục: ' + (e.message || e); }
    },
    async allow(){
      try{ if ((await dirH.requestPermission({mode: 'readwrite'})) === 'granted') await openDir(dirH); }catch(e){ st.err = 'Chưa được cấp quyền: ' + (e.message || e); }
    },
    importObj(o){ fromJSON(o); emitAll(); scheduleSave(); },
    exportText: () => JSON.stringify(toJSON(), null, 1),
    async saveNow(){ clearTimeout(saveT); if (st.status === 'ok') await writeFile(); }
  };
})();

/* ============ LUU TRU GITHUB (ba 28/10 – giai doan 2) ============
   Du lieu cua ba: kho rieng tu <owner>/hoc-tap-6a14-ba, moi bang 1 file du-lieu/<bang>.json.
   Kho cua con: <owner>/hoc-tap-6a14 – app ba "giao" ke hoach (ke-hoach/YYYY-MM-DD.json, chung/chung.json),
   app con ghi su kien (con-ghi/YYYY-MM-DD.json) -> app ba doc va ap vao bai tap / tien do.
   Ma truy cap (token) chi luu tren trinh duyet nay (localStorage). */
const GH = (() => {
  const COLS = ['tasks','keys','checks','progress','sbt','meta','logs','scores','reviews'];
  const CK = 'tro-ly-6a14-gh';
  const loadCfg = () => { try{ return JSON.parse(localStorage.getItem(CK) || 'null') || {}; }catch(e){ return {}; } };
  let cfg = loadCfg();
  const REPO = () => cfg.repo || 'hoc-tap-6a14-ba', KID = () => cfg.kidRepo || 'hoc-tap-6a14';
  const st = {status: 'start', dirName: '', savedAt: '', err: '', dirty: false, pubAt: '', kidAt: '', kind: 'gh'};
  let data = {}; COLS.forEach(c => data[c] = {});
  const sha = {}, pend = {}; COLS.forEach(c => pend[c] = new Set());
  const subs = new Set(); let onReload = null, partial = false;
  const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const pad = n => String(n).padStart(2, '0');
  const stamp = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  // ---- goi API GitHub ----
  const b64 = s => { const b = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < b.length; i += 0x8000) o += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(o); };
  const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g, '')), c => c.charCodeAt(0)));
  async function api(repo, path, opt = {}){
    const url = `https://api.github.com/repos/${cfg.owner}/${repo}/contents/${path}` + (opt.method ? '' : (path.includes('?') ? '&' : '?') + 't=' + Date.now());
    const r = await fetch(url, {method: opt.method || 'GET', cache: 'no-store',
      headers: {Authorization: 'Bearer ' + cfg.token, Accept: opt.raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json', ...(opt.body ? {'Content-Type': 'application/json'} : {})},
      body: opt.body ? JSON.stringify(opt.body) : undefined});
    if (r.status === 404 && opt.allow404) return null;
    if (!r.ok){ const e = new Error('GitHub ' + r.status); e.status = r.status; try{ e.detail = (await r.json()).message; }catch(_){} throw e; }
    return opt.raw ? r.text() : r.json();
  }
  const listDir = async (repo, dir) => (await api(repo, dir, {allow404: true})) || [];
  async function getJSON(repo, path){   // file nho (< 1 MB): tra ve {obj, sha}
    const m = await api(repo, path, {allow404: true}); if (!m) return {obj: null, sha: null};
    const txt = m.content ? unb64(m.content) : await api(repo, path, {raw: true});
    return {obj: JSON.parse(txt), sha: m.sha};
  }
  async function putText(repo, path, text, sha0, msg){
    const r = await api(repo, path, {method: 'PUT', body: {message: msg, content: b64(text), ...(sha0 ? {sha: sha0} : {})}});
    return r.content.sha;
  }
  // ---- thong bao cho app (cung kieu voi LOCAL) ----
  const fc = () => partial || st.status !== 'ok';
  const snapDoc = (col, id) => { const v = data[col][id]; return {id, exists: v !== undefined, data: () => clone(v), metadata: {fromCache: fc(), hasPendingWrites: false}}; };
  const snapCol = col => { const docs = Object.keys(data[col]).sort().map(id => snapDoc(col, id)); return {docs, size: docs.length, empty: !docs.length, metadata: {fromCache: fc(), hasPendingWrites: false}, docChanges: () => []}; };
  const fire = s => { try{ s.id ? s.cb(snapDoc(s.col, s.id)) : s.cb(snapCol(s.col)); }catch(e){ console.error(e); } };
  const emit = col => { subs.forEach(s => { if (s.col === col) fire(s); }); if (GH.onChange) GH.onChange(col); };
  const emitAll = () => { partial = true; COLS.forEach(emit); partial = false; ['meta', 'sbt', 'progress', 'tasks'].forEach(emit); if (onReload) onReload(); };
  // ---- doc ca kho cua ba ----
  async function loadAll(){
    const ls = await listDir(REPO(), 'du-lieu'), m = {}; ls.forEach(f => m[f.name] = f.sha);
    await Promise.all(COLS.map(async c => {
      const s0 = m[c + '.json']; if (!s0){ data[c] = {}; sha[c] = null; return; }
      const txt = await api(REPO(), 'du-lieu/' + c + '.json', {raw: true});
      data[c] = JSON.parse(txt || '{}'); sha[c] = s0;
    }));
    st.status = 'ok'; st.err = ''; st.dirName = cfg.owner + '/' + REPO();
    emitAll();
  }
  // ---- ghi: moi bang 1 file, gop khi trung voi thay doi tu noi khac (Claude / may khac) ----
  const timers = {}; let chain = Promise.resolve();
  function scheduleSave(col){

  }
  async function saveCol(col){

    for (let tries = 0; tries < 4; tries++){
      const ids = [...pend[col]];
      try{
        sha[col] = await putText(REPO(), 'du-lieu/' + col + '.json', JSON.stringify(data[col], null, 1), sha[col], `App ba: cap nhat ${col}`);
        ids.forEach(i => pend[col].delete(i));

        break;
      }catch(e){
        if (e.status === 409 || e.status === 422){   // file vua bi sua o noi khac -> lay ban moi, ap lai cac dong app vua sua
          const mine = {}; ids.forEach(i => mine[i] = data[col][i]);
          const ls = await listDir(REPO(), 'du-lieu'), f = ls.find(x => x.name === col + '.json');
          const fresh = f ? JSON.parse(await api(REPO(), 'du-lieu/' + col + '.json', {raw: true}) || '{}') : {};
          sha[col] = f ? f.sha : null;

          data[col] = fresh; emit(col); continue;

  setInterval(poll, 60000); window.addEventListener('focus', poll);
  // ---- API giong window.claude db ----
  const merge = (a, b) => { const o = {...(a || {})}; Object.entries(b || {}).forEach(([k, v]) => { o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? merge(o[k], v) : v; }); return o; };
  const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  const touch = (col, id) => { pend[col].add(id); emit(col); scheduleSave(col); };
  const docRef = path => { const [col, id] = path.split('/'); if (!data[col]){ data[col] = {}; pend[col] = new Set(); }
    return { id, path,
      get: async () => snapDoc(col, id),
      set: async v => { data[col][id] = clone(v); touch(col, id); },
      update: async v => { if (data[col][id] === undefined){ const e = new Error('not found'); e.code = 'invalid_argument'; throw e; } data[col][id] = merge(data[col][id], clone(v)); touch(col, id); },
      delete: async () => { delete data[col][id]; touch(col, id); },
      onSnapshot: (cb) => { const s = {col, id, cb}; subs.add(s); setTimeout(() => fire(s), 0); return () => subs.delete(s); } }; };
  const db = {
    doc: docRef,
    collection: col => { if (!data[col]){ data[col] = {}; pend[col] = new Set(); }
      return { path: col, doc: id => docRef(col + '/' + (id || rid())),
        get: async () => snapCol(col),
        add: async v => { const id = rid(); data[col][id] = clone(v); touch(col, id); return docRef(col + '/' + id); },
        onSnapshot: (cb) => { const s = {col, id: null, cb}; subs.add(s); setTimeout(() => fire(s), 0); return () => subs.delete(s); } }; }
  };
  const GH = {
    db, st,
    get cfg(){ return cfg; },
    set onReload(f){ onReload = f; },
    onChange: null, onPoll: null,
    kidRepo: KID,
    async start(){
      if (!cfg.owner || !cfg.token){ st.status = 'connect'; return db; }
      try{ await loadAll(); }catch(e){ st.status = 'connect'; st.err = e.status === 401 ? 'Mã truy cập không đúng hoặc đã bị thu hồi.' : e.status === 404 ? 'Không thấy kho ' + cfg.owner + '/' + REPO() + ' (hoặc mã không có quyền vào kho này).' : 'Chưa kết nối được GitHub: ' + (e.detail || e.message); }
      return db;

    async connect(){   // tu o nhap tren man hinh

      if (!o || !t){ st.err = 'Nhập tên tài khoản GitHub và mã truy cập.'; return; }

    async allow(){ await GH.start(); },
    importObj(o){ COLS.forEach(c => { data[c] = (o && o[c] && typeof o[c] === 'object') ? o[c] : {}; Object.keys(data[c]).forEach(i => pend[c].add(i)); scheduleSave(c); }); emitAll(); },

  const SCT = {tx15:'Kiểm tra 15 phút', tx45:'Kiểm tra 1 tiết', gk:'Giữa kỳ', ck:'Cuối kỳ', cong:'Điểm cộng'};
  return {
    tkb: TKB_LIST.map(x => ({from: x.from, no: x.no, t: x.t})),
    offDays: offDays(), cancelled: (S.meta && S.meta.cancelled) || {},
    english: [1,2,3,4,5,6].filter(w => PROFILE[w] && PROFILE[w].english),
    exams,
    scores: S.scores.slice().sort((a,b) => String(b.date).localeCompare(String(a.date))).slice(0, 12).map(x => ({subject: x.subject, type: SCT[x.type] || x.type, value: x.value, date: x.date})),
    subjects: SUBJECTS
  };
}
const PUB = {last: {}, busy: false, t: 0, day: ''};
function schedulePublish(ms){ clearTimeout(PUB.t); PUB.t = setTimeout(publishKid, ms == null ? 5000 : ms); }
async function pubFile(path, obj){
  const body = JSON.stringify(obj);
  if (PUB.last[path] && PUB.last[path].body === body) return false;
  let cur = PUB.last[path];
  if (!cur){ const g = await GH.kidGet(path); cur = {sha: g.sha, body: g.obj ? JSON.stringify({...g.obj, generatedAt: undefined}) : ''}; if (cur.body === JSON.stringify({...obj, generatedAt: undefined})){ PUB.last[path] = {sha: g.sha, body}; return false; } }
  try{ const s2 = await GH.kidPut(path, {...obj, generatedAt: new Date().toISOString()}, cur.sha, 'App ba: giao ' + path); PUB.last[path] = {sha: s2, body}; }
  catch(e){ if (e.status === 409 || e.status === 422){ delete PUB.last[path]; return pubFile(path, obj); } throw e; }
  return true;
}
async function publishKid(){
  if (S.store !== 'gh' || GH.st.status !== 'ok' || PUB.busy) return;
  if (!(S.tasksLoaded && S.metaLoaded && S.progLoaded && S.keysLoaded && S.sbtLoaded)){ schedulePublish(3000); return; }
  PUB.busy = true; let n = 0;
  try{
    const days = [TODAY, addDays(TODAY, 1), addDays(TODAY, 2)];
    for (const d of days) if (await pubFile('ke-hoach/' + d + '.json', studentPlan(d))) n++;
    if (await pubFile('chung/chung.json', kidCommon())) n++;
    GH.st.pubAt = stamp0(); GH.st.pubErr = '';
  }catch(e){ GH.st.pubErr = 'Chưa giao được kế hoạch cho con (' + (e.detail || e.message) + ')'; console.error(e); }
  PUB.busy = false; render();
}
const stamp0 = () => { const d = new Date(); return `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };

/* ============ DOC SU KIEN CON GHI TREN APP HOC SINH ============ */
const KID = {events: [], sha: {}, files: {}, busy: false, grades: {}, gsha: {}, gT: {}, open: {}, cdraft: {}};
const KID_MARK = {ok: 'done', unsure: 'review', no: 'help'};
async function ingestKid(){
  if (S.store !== 'gh' || GH.st.status !== 'ok' || KID.busy) return;
  if (!(S.tasksLoaded && S.metaLoaded && S.progLoaded && S.sbtLoaded)) return;
  KID.busy = true;
  try{
    const from = addDays(TODAY, -14);
    const ls = (await GH.kidList('con-ghi')).filter(f => /^\d{4}-\d{2}-\d{2}\.json$/.test(f.name) && f.name.slice(0, 10) >= from);
    for (const f of ls){ if (KID.sha[f.name] === f.sha) continue; const g = await GH.kidGet('con-ghi/' + f.name); KID.files[f.name] = (g.obj && g.obj.events) || []; KID.sha[f.name] = f.sha; }
    const cb = (await GH.kidList('cham-bai')).filter(f => /\.json$/.test(f.name));
    for (const f of cb){ const id = f.name.replace(/\.json$/, ''); if (KID.gsha[id] === f.sha) continue; const g = await GH.kidGet('cham-bai/' + f.name); if (g.obj){ KID.grades[id] = g.obj; KID.gsha[id] = g.sha; } }
    KID.events = Object.values(KID.files).flat().sort((a,b) => String(a.at).localeCompare(String(b.at)));
    const seen = (S.meta && S.meta.kidSeen) || {}, newSeen = {};
    for (const ev of KID.events){
      if (!ev.id || seen[ev.id]) continue;
      try{ await applyKid(ev); }catch(e){ console.error('kid event', ev, e); }
      newSeen[ev.id] = ev.day || TODAY;
    }
    if (Object.keys(newSeen).length){ await metaMerge({kidSeen: newSeen}); toast('Đã nhận ' + Object.keys(newSeen).length + ' thao tác mới của con'); }
    GH.st.kidAt = stamp0();
  }catch(e){ console.error(e); }
  KID.busy = false; render();
}
async function applyKid(ev){
  const day = ev.day || String(ev.at || '').slice(0, 10) || TODAY;
  if (ev.type === 'mark'){
    const v = ev.mark ? KID_MARK[ev.mark] : 'todo';
    const patch = {status: v, statusAt: day, doneAt: v === 'done' ? day : null, kidMark: ev.mark || '', kidAt: ev.at};
    if (v === 'help') patch.everHelp = true;
    const t = S.tasks.find(x => x.id === ev.taskId);
    if (t){ await updTask(t.id, patch); return; }
    if (String(ev.taskId).startsWith('v:')){
      const vt = defaultSBT(day).find(x => x.id === ev.taskId) || (ev.snap ? {...ev.snap} : null); if (!vt) return;
      const {id, virtual, ...rest} = vt; await addTask({...rest, ...patch}); return; }
    return;
  }
  if (ev.type === 'progress'){
    const sj = ev.subject; if (!sj) return;
    // Tinh huong tiet hoc (ba 29/10): 'off' = duoc nghi tiet -> ghi tiet bi huy (giong nut 'Khong hoc hom nay'); on thi / kiem tra / chua bai -> khong co bai moi
    const cx = cancelledOn(day);
    if (ev.mode === 'off'){ if (!cx.includes(sj)) await metaMerge({cancelled: {[day]: cx.concat([sj])}}); return; }
    if (cx.includes(sj)) await metaMerge({cancelled: {[day]: cx.filter(x => x !== sj)}});   // con doi lai: co hoc
    if (ev.mode && ev.mode !== 'new') return;
    const ls = parseLessons(sj, String(ev.lesson || '').trim()); if (!ls.length) return;
    const id = day + '_' + (SLUG[sj] || 'khac'), cur = S.progRaw ? S.progRaw.find(x => x.id === id) : null;
    if (cur && cur.by !== 'con') return;   // ba da nhap -> giu ban cua ba
    await setDoc('progress', id, {date: day, subject: sj, lesson: ls[ls.length-1], lessons: ls.length > 1 ? ls : [], pages: String(ev.pages || '').trim(), part: String(ev.part || '').trim(), note: String(ev.note || '').trim(), by: 'con', kidAt: ev.at});
    return;
  }
  if (ev.type === 'newtask'){
    if (!ev.subject || !String(ev.content || '').trim()) return;
    await addTask({subject: ev.subject, content: String(ev.content).trim(), due: ev.due || '', source: ev.source || 'V', assigned: day, prio: '', note: 'Con nhập trên app ' + fmt(day), fromKid: true, kidAt: ev.at, book: ev.source === 'S' ? 'SBT' : ev.source === 'G' ? 'SGK' : '', lessonNo: '', part: ''});
    return;
  }
  // note / read: chi hien trong khung "Con bao tren app"
}
// Bai on dien tu con nop: diem tu cham + cau sai + cau tu luan de ba cham (ket qua gui ve kho cua con: cham-bai/<idSuKien>.json)
function quizLineHTML(e){
  const G = KID.grades[e.id] || {}, gs = G.grades || {}, texts = e.texts || [], det = e.detail || [];
  const nG = texts.filter(t => gs[t.qid]).length;
  return `📤 Nộp bài ôn <b>${esc(e.subject)}</b> (lần ${e.attempt || 1}${e.min ? ', ' + e.min + ' phút' : ''}): <b>${e.got}/${e.max}</b> ý trắc nghiệm đúng${texts.length ? ` · tự luận ${nG ? 'ba đã chấm ' + nG + '/' + texts.length : '<b style="color:var(--p1)">' + texts.length + ' câu chờ ba chấm</b>'}` : ''}
    <details ${KID.open[e.id] ? 'open' : ''} data-kidq="${esc(e.id)}" style="margin:6px 0 4px"><summary class="small" style="cursor:pointer">Xem bài làm${det.length ? ' · ' + det.length + ' câu sai' : ''}</summary>
    ${det.length ? `<div class="small" style="margin:6px 0"><b>Câu sai:</b><ul style="margin:4px 0;padding-left:18px">${det.map(d => `<li><b>${esc(d.label)}</b> – con: ${esc(d.yours || '(trống)')} · đúng: ${esc(d.right)}</li>`).join('')}</ul></div>` : '<p class="small">Trắc nghiệm đúng hết.</p>'}
    ${texts.map(t => `<div class="small" style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0">
      <b>${esc(t.label)}</b> – ${esc(t.prompt)}<br><span class="muted">Con viết:</span> ${esc(t.text) || '<i>(bỏ trống)</i>'}<br><span class="muted">Gợi ý đáp án:</span> ${esc(t.model)}<br>
      <span class="muted">Máy dò được ${t.hits}/${t.need} ý chính.</span>
      <span style="display:inline-flex;gap:6px;margin-left:6px"><button class="btn ${gs[t.qid]==='dat'?'':'ghost'}" style="padding:2px 10px;font-size:12px" data-act="kidGrade" data-ev="${esc(e.id)}" data-q="${esc(t.qid)}" data-v="dat">✓ Đạt</button><button class="btn ${gs[t.qid]==='chua'?'':'ghost'}" style="padding:2px 10px;font-size:12px" data-act="kidGrade" data-ev="${esc(e.id)}" data-q="${esc(t.qid)}" data-v="chua">✗ Chưa đạt</button></span></div>`).join('')}
    <div class="row small" style="gap:6px;margin-top:6px"><input id="kc_${esc(e.id)}" value="${esc(KID.cdraft[e.id] ?? (G.comment || ''))}" placeholder="Nhận xét cho con (tuỳ chọn)" style="flex:1;min-width:200px"><button class="btn ghost" style="padding:2px 10px;font-size:12px" data-act="kidComment" data-ev="${esc(e.id)}">Gửi nhận xét</button>${G.at ? `<span class="muted">đã gửi ${stamp0At(G.at)}</span>` : ''}</div>
    </details>`;
}
const stamp0At = at => { const d = new Date(at); return isNaN(d) ? '' : `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };
function kidGradeSet(evId, patch){
  const e = KID.events.find(x => x.id === evId); if (!e) return;
  const G = KID.grades[evId] = {quizId: e.quizId, ev: evId, subject: e.subject, grades: {}, ...(KID.grades[evId] || {})};
  if (patch.grades) G.grades = {...G.grades, ...patch.grades}; if (patch.comment !== undefined) G.comment = patch.comment;
  G.at = new Date().toISOString(); KID.open[evId] = true; render();
  clearTimeout(KID.gT[evId]); KID.gT[evId] = setTimeout(() => kidGradeSave(evId), 1200);
}
async function kidGradeSave(evId){
  const path = 'cham-bai/' + evId + '.json';
  try{ if (!KID.gsha[evId]){ const g = await GH.kidGet(path); KID.gsha[evId] = g.sha; }
    const {_sha, ...body} = KID.grades[evId]; KID.gsha[evId] = await GH.kidPut(path, body, KID.gsha[evId], 'App ba: cham bai ' + (body.subject || ''));
    toast('Đã gửi kết quả chấm cho con'); }
  catch(e){ if (e.status === 409 || e.status === 422){ delete KID.gsha[evId]; return kidGradeSave(evId); } toast('Chưa gửi được kết quả chấm – thử lại'); }
}
function kidPanelHTML(day){
  if (S.store !== 'gh') return '';
  const ev = KID.events.filter(e => (e.day || String(e.at).slice(0,10)) === day);
  const tm = e => { const d = new Date(e.at); return isNaN(d) ? '' : `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; };
  const MK = {ok: '✓ xong đủ', unsure: '◯ xong, chưa chắc', no: '✗ chưa làm được'};
  const line = e => e.type === 'mark' ? `${e.mark ? MK[e.mark] : '↺ bỏ đánh dấu'} – <b>${esc(e.subject || '')}</b> ${esc(clip(e.text || '', 70))}`
    : e.type === 'progress' && e.mode && e.mode !== 'new' ? `${({review: '📝 Ôn tập / ôn thi (không học bài mới)', test: '✅ Làm bài kiểm tra', fix: '🛠️ Chữa bài / sửa đề', off: '🚫 Được nghỉ tiết (đã ghi tiết bị huỷ)'})[e.mode] || e.mode} – <b>${esc(e.subject)}</b>${e.part ? ' · ' + esc(e.part) : ''}`
    : e.type === 'progress' ? `📘 Nhập bài đã học – <b>${esc(e.subject)}</b> bài ${esc(e.lesson)}${e.pages ? ' tr.' + esc(e.pages) : ''}${e.part ? ' (' + esc(e.part) + ')' : ''}${e.note ? ' · ' + esc(e.note) : ''}`
    : e.type === 'newtask' ? `📝 Báo bài mới – <b>${esc(e.subject)}</b> ${esc(e.content)}${e.due ? ' · hạn ' + fmt(e.due) : ''}`
    : e.type === 'read' ? `📖 Đã đọc kiến thức – ${esc(e.text || '')}`
    : e.type === 'quiz' ? quizLineHTML(e)
    : e.type === 'start' ? '▶️ Con bắt đầu học' : e.type === 'finish' ? `🏁 Con báo đã xong buổi học${e.text ? ' – ' + esc(e.text) : ''}`
    : e.type === 'note' ? `💬 Con nhắn ba: <b>${esc(e.text || '')}</b>` : esc(e.type);
  const first = ev.find(e => e.type === 'mark'), last = [...ev].reverse().find(e => e.type === 'mark');
  return `<section class="card"><div class="eyebrow">📱 Con báo trên app học sinh</div>
    <h2>${ev.length ? ev.length + ' thao tác hôm ' + fmt(day) : 'Chưa có thao tác nào hôm ' + fmt(day)}</h2>
    ${first ? `<p class="small muted">Bắt đầu đánh dấu lúc <b>${tm(first)}</b> · lần cuối <b>${tm(last)}</b> (giờ máy của con)</p>` : ''}
    ${ev.length ? `<ul class="small" style="margin:8px 0 0;padding-left:18px">${ev.map(e => `<li><span class="muted">${tm(e)}</span> · ${line(e)}</li>`).join('')}</ul>` : ''}
    <p class="small muted" style="margin-top:8px">Kế hoạch đã giao cho con: ${GH.st.pubAt ? 'lúc ' + GH.st.pubAt : 'đang chuẩn bị…'}${GH.st.pubErr ? ` · <b style="color:var(--p1)">${esc(GH.st.pubErr)}</b>` : ''} · Kiểm tra thao tác của con: ${GH.st.kidAt ? 'lúc ' + GH.st.kidAt : '…'} <button class="btn ghost" style="padding:2px 10px;font-size:12px" data-act="kidSync">🔄 Cập nhật ngay</button></p>
  </section>`;
}

document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.kidq) KID.open[d.dataset.kidq] = d.open; }, true);
document.addEventListener('input', e => { const t = e.target; if (t && t.id && t.id.startsWith('kc_')) KID.cdraft[t.id.slice(3)] = t.value; }, true);

/* ============ KET NOI ============ */
async function loadKeys(){
  if (!S.db || S.keysBusy) return; S.keysBusy = true;
  for (let i = 0; i < 3; i++){
    try{ const q = await S.db.collection('keys').get(); const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.keys=o; S.keysAt = Date.now(); S.keysLoaded = true; break; }
    catch(e){ await new Promise(r => setTimeout(r, 800 + Math.random()*1200)); }
  }
  S.keysBusy = false; render();
}
setTimeout(() => { S.loadSlow = true; render(); }, 12000);
render();
(async () => {
  let db = null;
  try{ db = window.claude && await window.claude.use('db'); }catch(e){}
  if (!db){ let useFile = false; try{ useFile = localStorage.getItem('tro-ly-6a14-store') === 'file'; }catch(e){}
    if (useFile){ db = await LOCAL.start(); S.local = true; S.store = 'file'; LOCAL.onReload = () => { S.keysAt = 0; loadKeys(); }; }
    else { db = await GH.start(); S.local = true; S.store = 'gh'; GH.onReload = () => { S.keysAt = 0; loadKeys(); };
      GH.onChange = () => schedulePublish(); GH.onPoll = () => ingestKid();
      if (GH.st.status !== 'ok'){ S.db = db; S.dbState = 'ok'; render(); await new Promise(r => { const iv = setInterval(() => { if (GH.st.status === 'ok'){ clearInterval(iv); r(); } }, 500); }); }
      setTimeout(() => { ingestKid(); schedulePublish(0); }, 4000); } }   // chay tren may: du lieu trong file JSON
  if (!db){ S.dbState = 'none'; render(); return; }
  S.db = db; S.dbState = 'ok';
  // Chi tu tao bai (no bai cu / bai bi sot) khi du lieu da tai day du tu may chu – tranh tao trung khi moi co mot phan (ba 28/10)
  const fresh = q => !(q && q.metadata && q.metadata.fromCache);
  db.collection('tasks').onSnapshot(q => { S.tasks = q.docs.map(d=>({id:d.id, ...d.data()})); S.tasksLoaded = fresh(q); ensureBacklog(); ensureSkipped(); render(); }, () => { S.dbState='err'; render(); });
  db.collection('logs').onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.logs=o; Object.keys(o).forEach(k=>{ if(!S.logDraft[k] || !Object.keys(S.logDraft[k]).length) S.logDraft[k]={...o[k]}; }); render(); }, () => {});
  db.collection('sbt').onSnapshot(q => { const o={}; q.docs.forEach(d=>{ const v=d.data(); if (v && v.subject) o[d.id]=v; }); S.sbt=o; S.sbtLoaded = fresh(q); ensureBacklog(); ensureSkipped(); render(); }, () => {});
  // Loi giai (~1,2 MB) chi tai 1 lan khi mo trang, khong theo doi lien tuc (tranh tai lai lien tuc lam trang treo – ba 28/10)
  loadKeys();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState==='visible' && Date.now() - (S.keysAt||0) > 20*60*1000) loadKeys(); });
  db.collection('checks').onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.checks=o; render(); }, () => {});
  db.doc('meta/app').onSnapshot(d => { S.meta = d.exists ? d.data() : {}; S.metaLoaded = !(d.metadata && d.metadata.fromCache); ensureBacklog(); ensureSkipped(); render(); }, () => {});
  db.collection('scores').onSnapshot(q => { S.scores = q.docs.map(d=>({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('progress').onSnapshot(q => { setProgress(q.docs.map(d=>({id:d.id, ...d.data()}))); S.progLoaded = true; ensureBacklog(); ensureSkipped(); render(); }, () => {});
  db.collection('reviews').onSnapshot(q => { const o={}; q.docs.forEach(d=>o[d.id]=d.data()); S.reviews=o; Object.keys(o).forEach(k=>{ if(!S.revDraft[k] || !Object.keys(S.revDraft[k]).length) S.revDraft[k]={...o[k]}; }); render(); }, () => {});
  render();
})();
(async () => {
  let s = null;
  try{ s = window.claude && await window.claude.use('sample'); }catch(e){}
  S.sample = s || null;
  if (s){ try{ const l = await s.limits(); S.imagesOK = !!(l && l.images); S.imgMax = (l && l.images && l.images.maxCount) || 5; }catch(e){} }

})();
